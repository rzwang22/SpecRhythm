name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: pytest

  phase4-python311-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install '.[dev]'
      - run: specrhythm phase4-contract-dry-run --output /tmp/phase4-contract.json
      - run: python -m pytest -q tests/test_phase4.py
      - run: specrhythm-s0 --help
      - run: python -m pytest -q tests/test_serving_s0.py
      - run: specrhythm-s2 --help
      - run: python -m pytest -q tests/test_serving_s2.py tests/test_serving_s2_runtime.py tests/test_serving_s2_cli.py tests/test_serving_s2_results.py tests/test_serving_s2_uuid.py tests/test_serving_s2_terminal_drain.py
      - run: specrhythm-s1 --help
      - run: python -m pytest -q tests/test_serving_s1.py tests/test_serving_s1_performance.py tests/test_serving_s1_console.py tests/test_serving_s1_startup.py

  phase4b3-draft-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install '.[dev]'
      - uses: actions/checkout@v7
        with:
          repository: vllm-project/vllm
          ref: 752a3a504485790a2e8491cacbb35c137339ad34
          path: tmp/phase4b3-vllm-source
          sparse-checkout: vllm
      - run: python -m pytest tests/test_phase4_vllm_draft.py tests/test_phase4_vllm_draft_source.py tests/test_phase4_pingpong_source.py tests/test_serving_s2_source.py
        env:
          SR_PHASE4B3_SOURCE_AUDIT: tmp/phase4b3-vllm-source
