[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specrhythm"
version = "0.1.0"
description = "A dependency-free control-plane simulator for SLO-aware speculative decoding"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "SpecRhythm contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
gpu = [
  "PyYAML>=6,<7",
  "torch>=2.7.1,<2.8",
  "transformers>=4.56.1,<4.57",
]
workload = [
  "transformers>=4.56.1,<4.57",
  "huggingface_hub>=0.34,<1",
  "pyarrow>=14,<22",
  "jinja2>=3.1,<4",
]

[project.scripts]
specrhythm = "specrhythm.cli:main"
specrhythm-s0 = "specrhythm.serving.cli:main"
specrhythm-s1 = "specrhythm.serving.s1_cli:main"
specrhythm-s2 = "specrhythm.serving.s2_cli:main"
specrhythm-fixed = "specrhythm.serving.fixed_cli:main"
specrhythm-decode-scan = "specrhythm.serving.decode_scan_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"specrhythm.phase4" = ["vllm_draft_api.json", "d3_logits_probe_inputs.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "gpu: requires a real NVIDIA CUDA environment and is skipped on CPU CI",
]

[tool.ruff]
extend-exclude = ["tmp"]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
