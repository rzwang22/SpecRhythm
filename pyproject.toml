[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specrhythm"
version = "0.1.0"
description = "A dependency-free control-plane simulator for SLO-aware speculative decoding"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "SpecRhythm contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
gpu = [
  "PyYAML>=6,<7",
  "torch>=2.7.1,<2.8",
  "transformers>=4.56.1,<4.57",
]

[project.scripts]
specrhythm = "specrhythm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "gpu: requires a real NVIDIA CUDA environment and is skipped on CPU CI",
]

[tool.ruff]
extend-exclude = ["tmp"]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
